version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    environment:
      - ENVIRONMENT=development
      - DEMO_MODE=true
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 7860 --reload"
