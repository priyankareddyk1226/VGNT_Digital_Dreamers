services:
  - type: web
    name: bharat-land-intelligence
    env: docker
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_PADDLE_OCR
        value: "false"
      - key: ENABLE_SENTENCE_TRANSFORMERS
        value: "false"
      - key: ENABLE_LOCAL_LLM
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/data/land_intelligence.db
